var DOCS=[{"id": "qd_4820_tsbd", "group": "Quy \u0110\u1ecbnh", "groupColor": "#1e40af", "groupLight": "#dbeafe", "title": "Quy \u0111\u1ecbnh Th\u1ee7 t\u1ee5c Nh\u1eadn v\u00e0 Qu\u1ea3n l\u00fd T\u00e0i s\u1ea3n B\u1ea3o \u0111\u1ea3m", "shortTitle": "Q\u0110 Nh\u1eadn & QL T\u00e0i s\u1ea3n B\u1ea3o \u0111\u1ea3m", "docCode": "Q\u0110 4820/2025", "cards": [{"front": "Khi n\u00e0o TSB\u0110 l\u00e0 b\u1ea5t \u0111\u1ed9ng s\u1ea3n b\u1eaft bu\u1ed9c ph\u1ea3i c\u00f4ng ch\u1ee9ng H\u0110 th\u1ebf ch\u1ea5p?", "back": "B\u1eaeT BU\u1ed8C c\u00f4ng ch\u1ee9ng v\u1edbi T\u1ea4T C\u1ea2 c\u00e1c tr\u01b0\u1eddng h\u1ee3p th\u1ebf ch\u1ea5p quy\u1ec1n s\u1eed d\u1ee5ng \u0111\u1ea5t v\u00e0 t\u00e0i s\u1ea3n g\u1eafn li\u1ec1n v\u1edbi \u0111\u1ea5t."}, {"front": "Th\u1ea9m quy\u1ec1n quy\u1ebft \u0111\u1ecbnh vi\u1ec7c nh\u1eadn TSB\u0110 thu\u1ed9c v\u1ec1 ai?", "back": "Thu\u1ed9c c\u1ea5p c\u00f3 th\u1ea9m quy\u1ec1n ph\u00ea duy\u1ec7t c\u1ea5p t\u00edn d\u1ee5ng theo quy \u0111\u1ecbnh c\u1ee7a Vikki Bank trong t\u1eebng th\u1eddi k\u1ef3."}, {"front": "TSB\u0110 l\u00e0 ph\u01b0\u01a1ng ti\u1ec7n giao th\u00f4ng c\u1ea7n nh\u1eefng gi\u1ea5y t\u1edd g\u00ec?", "back": "(1) Gi\u1ea5y ch\u1ee9ng nh\u1eadn \u0111\u0103ng k\u00fd xe B\u1ea2N G\u1ed0C\n(2) Gi\u1ea5y ch\u1ee9ng nh\u1eadn ki\u1ec3m \u0111\u1ecbnh an to\u00e0n k\u1ef9 thu\u1eadt\n(3) B\u1ea3o hi\u1ec3m v\u1eadt ch\u1ea5t xe (n\u1ebfu b\u1eaft bu\u1ed9c)"}, {"front": "Khi n\u00e0o ph\u1ea3i \u0111\u0103ng k\u00fd Bi\u1ec7n ph\u00e1p B\u1ea3o \u0111\u1ea3m (BPB\u0110)?", "back": "B\u1eaeT BU\u1ed8C \u0111\u1ed1i v\u1edbi: QSD\u0110, t\u00e0i s\u1ea3n g\u1eafn li\u1ec1n v\u1edbi \u0111\u1ea5t, t\u00e0u bay, t\u00e0u bi\u1ec3n v\u00e0 c\u00e1c t\u00e0i s\u1ea3n theo y\u00eau c\u1ea7u c\u1ee7a Vikki Bank."}, {"front": "Gi\u1ea3i ch\u1ea5p TSB\u0110 \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n khi n\u00e0o?", "back": "Khi KH \u0111\u00e3 ho\u00e0n th\u00e0nh TO\u00c0N B\u1ed8 ngh\u0129a v\u1ee5 n\u1ee3, ho\u1eb7c \u0111\u01b0\u1ee3c c\u1ea5p c\u00f3 th\u1ea9m quy\u1ec1n ph\u00ea duy\u1ec7t cho r\u00fat b\u1edbt/thay th\u1ebf TSB\u0110."}, {"front": "Ai ch\u1ecbu tr\u00e1ch nhi\u1ec7m b\u1ea3o qu\u1ea3n b\u1ea3n ch\u00ednh gi\u1ea5y t\u1edd TSB\u0110?", "back": "\u0110\u01a1n v\u1ecb Qu\u1ea3n l\u00fd v\u00e0 H\u1ed7 tr\u1ee3 T\u00edn d\u1ee5ng (b\u1ed9 ph\u1eadn t\u01b0\u01a1ng \u0111\u01b0\u01a1ng t\u1ea1i CN) c\u1ea5t gi\u1eef trong kho qu\u1ef9."}, {"front": "\u0110i\u1ec1u ki\u1ec7n nh\u1eadn t\u00e0i s\u1ea3n h\u00ecnh th\u00e0nh trong t\u01b0\u01a1ng lai?", "back": "Ph\u1ea3i c\u00f3 \u0111\u1ea7y \u0111\u1ee7 h\u1ed3 s\u01a1 ph\u00e1p l\u00fd d\u1ef1 \u00e1n, h\u1ee3p \u0111\u1ed3ng mua b\u00e1n h\u1ee3p l\u1ec7 v\u00e0 \u0111\u01b0\u1ee3c ch\u1ee7 \u0111\u1ea7u t\u01b0 \u0111\u1ed3ng \u00fd (n\u1ebfu c\u1ea7n)."}, {"front": "T\u1ef7 l\u1ec7 cho vay t\u1ed1i \u0111a tr\u00ean gi\u00e1 tr\u1ecb \u0111\u1ecbnh gi\u00e1 B\u0110S th\u01b0\u1eddng l\u00e0 bao nhi\u00eau?", "back": "Th\u01b0\u1eddng kh\u00f4ng qu\u00e1 70-80% gi\u00e1 tr\u1ecb \u0111\u1ecbnh gi\u00e1 (t\u00f9y quy \u0111\u1ecbnh c\u1ea5p t\u00edn d\u1ee5ng t\u1eebng th\u1eddi k\u1ef3)."}, {"front": "Nh\u1eadn th\u1ebf ch\u1ea5p h\u00e0ng h\u00f3a lu\u00e2n chuy\u1ec3n \u2192 T\u1ea7n su\u1ea5t ki\u1ec3m tra t\u1ed1i thi\u1ec3u l\u00e0 bao nhi\u00eau?", "back": "T\u1ed1i thi\u1ec3u H\u00c0NG TH\u00c1NG ho\u1eb7c \u0111\u1ecbnh k\u1ef3 theo quy \u0111\u1ecbnh ph\u00ea duy\u1ec7t t\u00edn d\u1ee5ng."}, {"front": "TSB\u0110 l\u00e0 s\u1ed5 ti\u1ebft ki\u1ec7m Vikki Bank \u2192 C\u1ea7n th\u1ee7 t\u1ee5c g\u00ec?", "back": "(1) Phong t\u1ecfa t\u00e0i kho\u1ea3n/s\u1ed5 ti\u1ebft ki\u1ec7m tr\u00ean Core Banking\n(2) L\u1eadp H\u1ee3p \u0111\u1ed3ng c\u1ea7m c\u1ed1"}, {"front": "N\u1ebfu TSB\u0110 c\u00f3 tranh ch\u1ea5p \u2192 Vikki Bank c\u00f3 nh\u1eadn th\u1ebf ch\u1ea5p kh\u00f4ng?", "back": "KH\u00d4NG. TSB\u0110 ph\u1ea3i kh\u00f4ng c\u00f3 tranh ch\u1ea5p v\u1ec1 quy\u1ec1n s\u1edf h\u1eefu/s\u1eed d\u var SK='vikkiFlashcard_v3',state={known:{},review:{}};
try{var s=localStorage.getItem(SK);if(s)state=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}}
function gcs(id,i){var k=id+'_'+i;if(state.known[k])return 'known';if(state.review[k])return 'review';return 'new';}
function scs(id,i,st){var k=id+'_'+i;delete state.known[k];delete state.review[k];if(st==='known')state.known[k]=true;if(st==='review')state.review[k]=true;save();}
function gdp(d){var n=0;d.cards.forEach(function(_,i){if(gcs(d.id,i)==='known')n++;});return{known:n,total:d.cards.length};}
var cDoc=null,cCards=[],cIdx=0,cFil='all',cFlip=false;

function buildHome(){
  var tc=DOCS.reduce(function(s,d){return s+d.cards.length;},0),tk=0;
  DOCS.forEach(function(d){tk+=gdp(d).known;});
  document.getElementById('stat-docs').textContent=DOCS.length;
  document.getElementById('stat-cards').textContent=tc;
  document.getElementById('stat-done').textContent=Math.round(tk/tc*100)+'%';
  var G={};
  DOCS.forEach(function(d){
    if(!G[d.group])G[d.group]={color:d.groupColor,light:d.groupLight||'#f3f4f6',docs:[]};
    G[d.group].docs.push(d);
  });
  var h='';
  Object.keys(G).forEach(function(gn){
    var g=G[gn];
    h+='<div class="group-section"><div class="group-title" style="background:'+g.color+'">'+gn+'</div><div class="doc-list">';
    g.docs.forEach(function(d){
      var p=gdp(d),pct=Math.round(p.known/p.total*100);
      h+='<div class="doc-item" data-id="'+d.id+'"><span class="doc-code" style="background:'+g.light+';color:'+g.color+'">'+d.docCode+'</span><div class="doc-info"><div class="doc-title">'+d.shortTitle+'</div><div class="doc-meta">'+p.total+' the &bull; '+p.known+' da nho</div></div><div class="doc-progress"><div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%;background:'+g.color+'"></div></div><div class="prog-text">'+pct+'%</div></div><span class="doc-arrow">&#8250;</span></div>';
    });
    h+='</div></div>';
  });
  document.getElementById('groups-container').innerHTML=h;
  document.querySelectorAll('.doc-item').forEach(function(el){
    el.addEventListener('click',function(){startStudy(this.getAttribute('data-id'));});
  });
}

function startStudy(id){
  cDoc=null;for(var i=0;i<DOCS.length;i++){if(DOCS[i].id===id){cDoc=DOCS[i];break;}}
  if(!cDoc)return;
  cFil='all';cIdx=0;cFlip=false;bcc();
  document.getElementById('study-doc-name').textContent=cDoc.shortTitle;
  var ce=document.getElementById('study-doc-code');ce.textContent=cDoc.docCode;ce.style.background=cDoc.groupColor;
  document.documentElement.style.setProperty('--accent',cDoc.groupColor);
  document.documentElement.style.setProperty('--accent-light',cDoc.groupLight||'#f3f4f6');
  ['all','review','known'].forEach(function(x){document.getElementById('filter-'+x).classList.toggle('active',x==='all');});
  showScr('study');
  document.getElementById('header-sub').textContent=cDoc.group+' > '+cDoc.shortTitle;
}

function bcc(){
  cCards=cDoc.cards.map(function(c,i){return{front:c.front,back:c.back,idx:i};});
  if(cFil==='review')cCards=cCards.filter(function(c){return gcs(cDoc.id,c.idx)==='review';});
  else if(cFil==='known')cCards=cCards.filter(function(c){return gcs(cDoc.id,c.idx)==='known';});
  if(cIdx>=cCards.length)cIdx=Math.max(0,cCards.length-1);
}

function setFilter(f){
  cFil=f;['all','review','known'].forEach(function(x){document.getElementById('filter-'+x).classList.toggle('active',x===f);});
  bcc();cIdx=0;cFlip=false;rc();
}

function shuffle(){
  bcc();for(var i=cCards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=cCards[i];cCards[i]=cCards[j];cCards[j]=t;}
  cIdx=0;cFlip=false;rc();
}

function rc(){
  var a=document.getElementById('study-main');
  if(!cCards.length){
    a.innerHTML='<div class="done-banner"><div class="emoji">&#10024;</div><h2>Khong co the nao!</h2><p>Hay thay doi bo loc.</p><button class="btn-restart" id="brst">Xem tat ca</button></div>';
    document.getElementById('card-counter').textContent='0/0';
    var brst=document.getElementById('brst');if(brst)brst.addEventListener('click',function(){setFilter('all');});
    return;
  }
  var c=cCards[cIdx],st=gcs(cDoc.id,c.idx);
  var sb=st==='known'?'&#9989; Da nho':st==='review'?'&#9201; Can on lai':'Moi';
  document.getElementById('card-counter').textContent=(cIdx+1)+'/'+cCards.length;
  var bt=(c.back||'').replace(/\n/g,'<br>');
  a.innerHTML=
    '<div style="text-align:center;margin-bottom:7px;font-size:.74rem;color:#6b7280">'+sb+'</div>'+
    '<div class="card-wrapper" id="cwrap"><div class="card-inner'+(cFlip?' flipped':'')+'" id="cinn">'+
    '<div class="card-face card-front"><div class="card-label">CAU HOI</div><div class="card-text">'+c.front+'</div><div class="card-hint">Nhan de xem dap an</div></div>'+
    '<div class="card-face card-back"><div class="card-label">DAP AN</div><div class="card-text">'+bt+'</div></div>'+
    '</div></div>'+
    '<div class="action-row"><button class="btn-action btn-forgot" id="bfg">&#128517; Chua nho</button><button class="btn-action btn-knew" id="bkn">&#9989; Da nho!</button></div>'+
    '<div class="nav-row"><button class="btn-nav" id="bpv" '+(cIdx===0?'disabled':'')+'>&#8592; Truoc</button><button class="btn-nav" id="bnx" '+(cIdx===cCards.length-1?'disabled':'')+'>Tiep &#8594;</button></div>';
  document.getElementById('cwrap').addEventListener('click',flip);
  document.getElementById('bfg').addEventListener('click',function(){mk('review');});
  document.getElementById('bkn').addEventListener('click',function(){mk('known');});
  var bp=document.getElementById('bpv');if(bp)bp.addEventListener('click',prev);
  var bn=document.getElementById('bnx');if(bn)bn.addEventListener('click',next);
}

function flip(){cFlip=!cFlip;var el=document.getElementById('cinn');if(el)el.classList.toggle('flipped',cFlip);}
function next(){if(cIdx<cCards.length-1){cIdx++;cFlip=false;rc();}}
function prev(){if(cIdx>0){cIdx--;cFlip=false;rc();}}
function mk(st){
  if(!cCards.length)return;scs(cDoc.id,cCards[cIdx].idx,st);
  setTimeout(function(){if(cIdx<cCards.length-1){cIdx++;cFlip=false;rc();}else{bcc();rc();}},260);
  var tc=DOCS.reduce(function(s,d){return s+d.cards.length;},0),tk=0;
  DOCS.forEach(function(d){tk+=gdp(d).known;});
  var el=document.getElementById('stat-done');if(el)el.textContent=Math.round(tk/tc*100)+'%';
}

function goHome(){showScr('home');buildHome();document.getElementById('header-sub').textContent='Chon tai lieu de bat dau hoc';}
function showScr(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById('screen-'+id).classList.add('active');}
document.getElementById('btn-back-top').addEventListener('click',goHome);
document.getElementById('filter-all').addEventListener('click',function(){setFilter('all');});
document.getElementById('filter-review').addEventListener('click',function(){setFilter('review');});
document.getElementById('filter-known').addEventListener('click',function(){setFilter('known');});
document.getElementById('btn-shuffle').addEventListener('click',shuffle);
document.addEventListener('keydown',function(e){
  if(!document.getElementById('screen-study').classList.contains('active'))return;
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(e.code==='ArrowRight')next();
  else if(e.code==='ArrowLeft')prev();
  else if(e.code==='KeyG')mk('known');
  else if(e.code==='KeyF')mk('review');
  else if(e.code==='Escape')goHome();
});
buildHome();
</script>
</body>
</html>
